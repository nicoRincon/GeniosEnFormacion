data:
  raw: "ai-component/data/raw"
  processed: "ai-component/data/processed"

model:
  type: "KNeighborsClassifier"
  n_neighbors: 5

training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001

evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score

inference:
  input_shape: [1, 1]  # Shape of input data for inference
  output_classes: 5     # Number of classes for classification

logging:
  level: "INFO"
  log_file: "ai-component/logs/training.log"